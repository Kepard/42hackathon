[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holospeed"
version = "0.1.0"
description = "State-aware Minecraft speedrunner, Fabric skills, and live dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "pillow>=11,<13",
    "nbt==1.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
holospeed = "holospeed.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["controller/holospeed"]

[tool.pytest.ini_options]
testpaths = ["controller/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
