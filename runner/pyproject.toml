[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mc-observatory"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["websockets>=12,<17", "aiohttp>=3.9,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "jsonschema>=4,<5"]

[project.scripts]
obs = "mc_observatory.run:main"
mc-bench = "mc_observatory.bench:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27,<1"]
bench = ["cua-bench>=0.3.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires running mod; opt in with MC_LIVE=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mc_observatory"]
